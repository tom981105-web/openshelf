<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Engine Lab — OpenShelf</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="playground.css"></head><body><main class="playground-shell"><a href="playground-hub.html" class="playground-back">← Playground Hub</a><div class="playground-eyebrow">OPENSHELF / RUN LOCAL</div><h1>CSV Engine<span>.</span></h1><p class="playground-intro">실제 오픈소스 Papa Parse 라이브러리로 CSV를 브라우저에서 분석합니다. VisiData·q의 원본 프로그램 실행이 아닌 관련 데이터 처리 체험입니다. 최초 라이브러리 로딩 시 네트워크가 필요합니다.</p><section class="playground-panel"><div class="playground-heading"><h2>CSV Parser · Papa Parse</h2><span id="csvState">엔진 로딩 중…</span></div><label class="playground-input-label" for="csvInput">CSV 입력</label><textarea id="csvInput" rows="9" spellcheck="false">name,category,stars

q,CLI,1000
OpenShelf,Collection,2000</textarea><div class="playground-actions"><button id="csvRun" class="playground-primary" disabled>CSV 분석 실행 →</button><button id="csvReset">초기화</button><button id="csvCopy">JSON 결과 복사</button></div><div class="playground-result-title"><h3>파싱 결과 (JSON)</h3><span id="csvStatus" aria-live="polite">준비 중</span></div><pre id="csvOutput" class="playground-output">엔진 로딩 중…</pre></section><p class="playground-footnote">로컬 처리 · 입력 50,000자 제한 · Papa Parse 5.5.3. 입력은 별도 서버에 전송하지 않습니다.</p></main><script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js" defer></script><script src="playground-csv.js" defer></script></body></html>
