name: Validate OpenShelf data

on:
  pull_request:
    paths:
      - 'data/tools.json'
      - 'scripts/validate-tools.mjs'
      - 'scripts/validate-tools.test.mjs'
      - 'scripts/guard-discovery.mjs'
      - 'scripts/guard-discovery.test.mjs'
      - 'playground-core.mjs'
      - 'playground-core.test.mjs'
      - 'public-api.html'
      - 'public-api.js'
      - 'public-api.css'
      - 'public-api-core.mjs'
      - 'public-api.test.mjs'
      - 'data/public-api-candidates.json'
      - 'data/public-api-discovery-state.json'
      - 'scripts/discover-public-apis.mjs'
      - 'scripts/discover-public-apis.test.mjs'
      - 'scripts/refresh-public-apis.mjs'
      - 'scripts/refresh-public-apis.test.mjs'
      - '.github/workflows/refresh-public-apis.yml'
      - 'data/public-apis.json'
      - 'index.html'
      - 'playground-catalog.js'
      - 'playground-catalog.test.mjs'
      - 'playground-python.html'
      - 'playground-python.js'
      - 'scripts/check-python-chart-ui.mjs'
      - 'playground-python-worker.js'
      - 'playground-python-chart.mjs'
      - 'scripts/check-python-chart.mjs'
      - 'playground-image.html'
      - 'playground-image.js'
      - 'playground-sql.html'
      - 'playground-sql.js'
      - 'playground-sql-worker.js'
      - 'playground-csv.html'
      - 'playground-csv.js'
      - 'playground-engine.js'
      - 'playground-engine.html'
      - 'playground-jsonata.html'
      - 'playground-jsonata.js'
      - 'playground-jsonata-worker.js'
      - 'playground.js'
      - 'playground.html'
      - 'playground-hub.html'
      - 'playground-hub.css'
      - 'playground-hub.js'
      - 'playground-all.js'
      - 'playground-launch-core.mjs'
      - 'playground-launch-core.test.mjs'
      - 'playground-all.html'
      - 'playground-all.css'
      - 'playground-candidates.html'
      - 'playground-candidates.js'
      - 'data/playground-candidates.json'
      - 'scripts/playground-candidates.mjs'
      - 'scripts/playground-candidates.test.mjs'
      - 'scripts/probe-playground-candidates.mjs'
      - 'scripts/probe-playground-candidates.test.mjs'
      - 'data/playground-probes.json'
      - '.github/workflows/probe-playground.yml'
      - 'playground-live.html'
      - '.github/workflows/validate-tools.yml'
  push:
    branches: [main]
    paths:
      - 'data/tools.json'
      - 'scripts/validate-tools.mjs'
      - 'scripts/validate-tools.test.mjs'
      - 'scripts/guard-discovery.mjs'
      - 'scripts/guard-discovery.test.mjs'
      - 'playground-core.mjs'
      - 'playground-core.test.mjs'
      - 'public-api.html'
      - 'public-api.js'
      - 'public-api.css'
      - 'public-api-core.mjs'
      - 'public-api.test.mjs'
      - 'data/public-api-candidates.json'
      - 'data/public-api-discovery-state.json'
      - 'scripts/discover-public-apis.mjs'
      - 'scripts/discover-public-apis.test.mjs'
      - 'scripts/refresh-public-apis.mjs'
      - 'scripts/refresh-public-apis.test.mjs'
      - '.github/workflows/refresh-public-apis.yml'
      - 'data/public-apis.json'
      - 'index.html'
      - 'playground-catalog.js'
      - 'playground-catalog.test.mjs'
      - 'playground-python.html'
      - 'playground-python.js'
      - 'scripts/check-python-chart-ui.mjs'
      - 'playground-python-worker.js'
      - 'playground-python-chart.mjs'
      - 'scripts/check-python-chart.mjs'
      - 'playground-image.html'
      - 'playground-image.js'
      - 'playground-sql.html'
      - 'playground-sql.js'
      - 'playground-sql-worker.js'
      - 'playground-csv.html'
      - 'playground-csv.js'
      - 'playground-engine.js'
      - 'playground-engine.html'
      - 'playground-jsonata.html'
      - 'playground-jsonata.js'
      - 'playground-jsonata-worker.js'
      - 'playground.js'
      - 'playground.html'
      - 'playground-hub.html'
      - 'playground-hub.css'
      - 'playground-hub.js'
      - 'playground-all.js'
      - 'playground-launch-core.mjs'
      - 'playground-launch-core.test.mjs'
      - 'playground-all.html'
      - 'playground-all.css'
      - 'playground-candidates.html'
      - 'playground-candidates.js'
      - 'data/playground-candidates.json'
      - 'scripts/playground-candidates.mjs'
      - 'scripts/playground-candidates.test.mjs'
      - 'scripts/probe-playground-candidates.mjs'
      - 'scripts/probe-playground-candidates.test.mjs'
      - 'data/playground-probes.json'
      - '.github/workflows/probe-playground.yml'
      - '.github/workflows/validate-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public API discovery tests
        run: node scripts/discover-public-apis.test.mjs
      - name: Public API refresh safety tests
        run: node scripts/refresh-public-apis.test.mjs
      - name: Public API catalog smoke tests
        run: |
          node public-api.test.mjs
          node --check public-api.js
      - name: Validator smoke tests
        run: node scripts/validate-tools.test.mjs
      - name: Discovery safety guard tests
        run: node scripts/guard-discovery.test.mjs
      - name: Playground functional smoke tests
        run: node playground-core.test.mjs
      - name: Browser engine JavaScript syntax
        run: node --check playground-engine.js
      - name: JSONata engine JavaScript syntax
        run: |
          node --check playground-jsonata.js
          node --check playground-jsonata-worker.js
      - name: Playground hub JavaScript syntax
        run: |
          node --check playground-hub.js
          node --check playground-catalog.js
      - name: Candidate scanner tests
        run: |
          node scripts/playground-candidates.test.mjs
          node --check playground-candidates.js
      - name: Playground probe safety tests
        run: node scripts/probe-playground-candidates.test.mjs
      - name: Safe launch classifier tests
        run: node playground-launch-core.test.mjs
      - name: Universal tool navigator syntax
        run: node --check playground-all.js
      - name: SQLite WebAssembly engine JavaScript syntax
        run: |
          node --check playground-sql.js
          node --check playground-sql-worker.js
      - name: Python CSV example integration contract
        run: node scripts/check-python-csv.mjs
      - name: Python chart UI regression tests
        run: node scripts/check-python-chart-ui.mjs
      - name: Python chart renderer tests
        run: node scripts/check-python-chart.mjs
      - name: Python WASM runtime syntax
        run: |
          node --check playground-python.js
          node --check playground-python-worker.js
      - name: Image lab JavaScript syntax
        run: node --check playground-image.js
      - name: CSV engine JavaScript syntax
        run: node --check playground-csv.js
      - name: Playground catalog routing tests
        run: node playground-catalog.test.mjs
      - name: Validate tools.json
        run: node scripts/validate-tools.mjs data/tools.json
