name: Validate OpenShelf data

on:
  pull_request:
    paths:
      - 'data/tools.json'
      - 'scripts/validate-tools.mjs'
      - 'scripts/validate-tools.test.mjs'
      - 'scripts/guard-discovery.mjs'
      - 'scripts/guard-discovery.test.mjs'
      - 'public-api.html'
      - 'public-api.js'
      - 'public-api.css'
      - 'public-api-core.mjs'
      - 'public-api.test.mjs'
      - 'data/public-api-candidates.json'
      - 'data/public-api-discovery-state.json'
      - 'scripts/diagnose-public-apis.mjs'
      - 'scripts/diagnose-public-apis.test.mjs'
      - 'scripts/discover-public-apis.mjs'
      - 'scripts/discover-public-apis.test.mjs'
      - 'scripts/refresh-public-apis.mjs'
      - 'scripts/refresh-public-apis.test.mjs'
      - '.github/workflows/refresh-public-apis.yml'
      - 'data/public-apis.json'
      - 'index.html'
      - '.github/workflows/validate-tools.yml'
  push:
    branches: [main]
    paths:
      - 'data/tools.json'
      - 'scripts/validate-tools.mjs'
      - 'scripts/validate-tools.test.mjs'
      - 'scripts/guard-discovery.mjs'
      - 'scripts/guard-discovery.test.mjs'
      - 'public-api.html'
      - 'public-api.js'
      - 'public-api.css'
      - 'public-api-core.mjs'
      - 'public-api.test.mjs'
      - 'data/public-api-candidates.json'
      - 'data/public-api-discovery-state.json'
      - 'scripts/diagnose-public-apis.mjs'
      - 'scripts/diagnose-public-apis.test.mjs'
      - 'scripts/discover-public-apis.mjs'
      - 'scripts/discover-public-apis.test.mjs'
      - 'scripts/refresh-public-apis.mjs'
      - 'scripts/refresh-public-apis.test.mjs'
      - '.github/workflows/refresh-public-apis.yml'
      - 'data/public-apis.json'
      - 'index.html'
      - '.github/workflows/validate-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public API diagnostics tests
        run: node scripts/diagnose-public-apis.test.mjs
      - name: Public API discovery tests
        run: node scripts/discover-public-apis.test.mjs
      - name: Public API refresh safety tests
        run: node scripts/refresh-public-apis.test.mjs
      - name: Public API catalog smoke tests
        run: |
          node public-api.test.mjs
          node --check public-api.js
      - name: Validator smoke tests
        run: node scripts/validate-tools.test.mjs
      - name: Discovery safety guard tests
        run: node scripts/guard-discovery.test.mjs
      - name: Validate tools.json
        run: node scripts/validate-tools.mjs data/tools.json
