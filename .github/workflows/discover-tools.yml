name: Discover OpenShelf tools

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openshelf-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover 5 popular tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: node scripts/discover-tools.mjs

      - name: Commit new tools
        run: |
          if git diff --quiet -- data/tools.json data/discovery-state.json; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "openshelf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tools.json data/discovery-state.json
          git commit -m "chore: discover 5 OpenShelf tools"
          git pull --rebase
          git push
