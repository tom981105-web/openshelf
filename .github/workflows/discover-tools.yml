name: Discover OpenShelf tools

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openshelf-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate V49 discovery and admin rendering
        run: node scripts/v49-discovery-review.test.cjs

      - name: Discover up to 20 popular tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/discover-tools.mjs

      - name: Test V51 autonomous review decisions
        run: node scripts/auto-review-v51.test.mjs

      - name: Auto review newly discovered repositories
        run: node scripts/auto-review-v51.mjs

      - name: Verify held licenses against official GitHub evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/license-evidence-v53.mjs

      - name: Inspect held LICENSE and README evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/document-evidence-v54.mjs

      - name: Recheck up to five held entries with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: node scripts/gemini-recheck-v51.mjs

      - name: Validate discovery output before commit
        run: |
          node scripts/validate-tools.test.mjs
          node scripts/validate-tools.mjs data/tools.json
          node scripts/guard-discovery.test.mjs
          node scripts/guard-discovery.mjs

      - name: Commit new tools
        run: |
          if git diff --quiet -- data/tools.json data/discovery-state.json data/discovery-log.json data/auto-review-v51.json; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "openshelf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tools.json data/discovery-state.json data/discovery-log.json data/auto-review-v51.json
          git commit -m "chore: discover OpenShelf tools"
          git pull --rebase
          git push
