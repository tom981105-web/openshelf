name: Update popularity

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-popularity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh GitHub stars and forks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/tools.json';
            const tools = JSON.parse(fs.readFileSync(path, 'utf8'));
            const today = new Date().toISOString().slice(0, 10);

            for (const tool of tools) {
              if (!tool.github) continue;
              const match = tool.github.match(/github\.com\/([^/]+)\/([^/#?]+)/i);
              if (!match) continue;

              const owner = match[1];
              const repo = match[2].replace(/\.git$/, '');

              try {
                const { data } = await github.rest.repos.get({ owner, repo });
                const previousStars = Number(tool.stars || data.stargazers_count);
                tool.previousStars = previousStars;
                tool.stars = data.stargazers_count;
                tool.starDelta1d = Math.max(0, tool.stars - previousStars);
                tool.forks = data.forks_count;
                tool.githubPushedAt = data.pushed_at || null;
                tool.githubUpdatedAt = data.updated_at || null;
                tool.githubArchived = Boolean(data.archived);
                tool.openIssues = Number(data.open_issues_count || 0);
                tool.defaultBranch = data.default_branch || null;
                tool.starsUpdatedAt = today;

                try {
                  const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo });
                  tool.latestRelease = {
                    tag: release.tag_name || null,
                    name: release.name || null,
                    publishedAt: release.published_at || release.created_at || null,
                    url: release.html_url || null
                  };
                } catch (releaseError) {
                  if (releaseError.status === 404) {
                    tool.latestRelease = null;
                  } else {
                    core.warning(`Could not refresh latest release for ${tool.name}: ${releaseError.message}`);
                  }
                }

                core.info(`${tool.name}: ★ ${tool.stars} (+${tool.starDelta1d}), pushed ${tool.githubPushedAt || "unknown"}`);
              } catch (error) {
                core.warning(`Could not refresh ${tool.name}: ${error.message}`);
              }
            }

            fs.writeFileSync(path, JSON.stringify(tools, null, 2) + '\n');

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- data/tools.json; then
            echo "No popularity changes."
            exit 0
          fi
          git config user.name "openshelf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tools.json
          git commit -m "chore: refresh tool popularity"
          git push
