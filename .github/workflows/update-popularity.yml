name: Hourly project health refresh

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openshelf-hourly-health
  cancel-in-progress: false

jobs:
  refresh-project-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh all GitHub project health
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const toolsPath = 'data/tools.json';
            const statePath = 'data/health-state.json';
            const rawTools = fs.readFileSync(toolsPath, 'utf8');
            if (!rawTools.trim()) {
              throw new Error('Safety stop: data/tools.json is empty. Refusing to overwrite the catalog.');
            }
            const tools = JSON.parse(rawTools);
            if (!Array.isArray(tools) || tools.length < 100) {
              throw new Error(`Safety stop: suspicious tools catalog size (${Array.isArray(tools) ? tools.length : 'not-array'}). Refusing to write.`);
            }
            const startingToolCount = tools.length;
            const now = new Date().toISOString();

            let state = {};
            try {
              state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
            } catch {
              state = {};
            }

            let checked = 0;
            let updated = 0;
            let failed = 0;
            let unavailable = 0;
            const failures = [];

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (const tool of tools) {
              if (!tool.github) continue;

              const match = String(tool.github).match(/github\.com\/([^/]+)\/([^/#?]+)/i);
              if (!match) continue;

              const owner = match[1];
              const repo = match[2].replace(/\.git$/i, '');
              checked++;

              try {
                const before = JSON.stringify({
                  stars: tool.stars,
                  forks: tool.forks,
                  githubPushedAt: tool.githubPushedAt,
                  githubUpdatedAt: tool.githubUpdatedAt,
                  githubArchived: tool.githubArchived,
                  openIssues: tool.openIssues,
                  defaultBranch: tool.defaultBranch,
                  latestRelease: tool.latestRelease,
                  githubLicense: tool.githubLicense,
                  githubHomepage: tool.githubHomepage,
                  githubVisibility: tool.githubVisibility,
                  githubDisabled: tool.githubDisabled
                });

                const { data } = await github.rest.repos.get({ owner, repo });

                const previousStars = Number(tool.stars ?? data.stargazers_count);
                tool.previousStars = previousStars;
                tool.stars = Number(data.stargazers_count || 0);
                tool.starDelta1h = Math.max(0, tool.stars - previousStars);
                tool.forks = Number(data.forks_count || 0);
                tool.githubPushedAt = data.pushed_at || null;
                tool.githubUpdatedAt = data.updated_at || null;
                tool.githubArchived = Boolean(data.archived);
                tool.githubDisabled = Boolean(data.disabled);
                tool.githubVisibility = data.visibility || null;
                tool.openIssues = Number(data.open_issues_count || 0);
                tool.defaultBranch = data.default_branch || null;
                tool.githubLicense = data.license?.spdx_id || null;
                tool.githubHomepage = data.homepage || null;
                tool.healthCheckedAt = now;
                tool.healthCheckStatus = 'ok';
                tool.healthCheckError = null;

                // Only fill missing/unclear curated fields from authoritative GitHub metadata.
                const currentLicense = String(tool.license || '').trim();
                if (
                  data.license?.spdx_id &&
                  data.license.spdx_id !== 'NOASSERTION' &&
                  (!currentLicense || /확인 필요|unknown|noassertion/i.test(currentLicense))
                ) {
                  tool.license = data.license.spdx_id;
                }

                if (!tool.website && data.homepage) {
                  tool.website = data.homepage;
                }

                try {
                  const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo });
                  tool.latestRelease = {
                    tag: release.tag_name || null,
                    name: release.name || null,
                    publishedAt: release.published_at || release.created_at || null,
                    url: release.html_url || null
                  };
                } catch (releaseError) {
                  if (releaseError.status === 404) {
                    tool.latestRelease = null;
                  } else {
                    core.warning(`Could not refresh latest release for ${tool.name}: ${releaseError.message}`);
                  }
                }

                const after = JSON.stringify({
                  stars: tool.stars,
                  forks: tool.forks,
                  githubPushedAt: tool.githubPushedAt,
                  githubUpdatedAt: tool.githubUpdatedAt,
                  githubArchived: tool.githubArchived,
                  openIssues: tool.openIssues,
                  defaultBranch: tool.defaultBranch,
                  latestRelease: tool.latestRelease,
                  githubLicense: tool.githubLicense,
                  githubHomepage: tool.githubHomepage,
                  githubVisibility: tool.githubVisibility,
                  githubDisabled: tool.githubDisabled
                });

                if (before !== after) updated++;
                core.info(`${tool.name}: health OK · ★ ${tool.stars} · pushed ${tool.githubPushedAt || 'unknown'}`);
              } catch (error) {
                failed++;
                const status = Number(error.status || 0);
                if (status === 404 || status === 410 || status === 451) unavailable++;

                tool.healthCheckedAt = now;
                tool.healthCheckStatus = status === 404 ? 'not_found' : status === 403 ? 'forbidden' : 'error';
                tool.healthCheckError = String(error.message || error).slice(0, 300);

                failures.push({
                  id: tool.id,
                  name: tool.name,
                  github: tool.github,
                  status: status || null,
                  error: String(error.message || error).slice(0, 180)
                });

                core.warning(`Could not refresh ${tool.name}: ${error.message}`);
              }

              // Keep API usage gentle on large catalogs.
              await sleep(60);
            }

            state = {
              version: 1,
              lastRun: now,
              checked,
              updated,
              failed,
              unavailable,
              totalTools: tools.length,
              status: failed === 0 ? 'success' : (checked > failed ? 'partial' : 'failed'),
              failures: failures.slice(0, 50)
            };

            if (!Array.isArray(tools) || tools.length !== startingToolCount || tools.length < 100) {
              throw new Error(`Safety stop before write: catalog count changed unexpectedly (${startingToolCount} -> ${Array.isArray(tools) ? tools.length : 'not-array'}).`);
            }

            const toolsJson = JSON.stringify(tools, null, 2) + '\n';
            const stateJson = JSON.stringify(state, null, 2) + '\n';
            if (toolsJson.length < 10000) {
              throw new Error(`Safety stop before write: serialized tools.json is suspiciously small (${toolsJson.length} bytes).`);
            }

            const toolsTemp = toolsPath + '.tmp';
            const stateTemp = statePath + '.tmp';
            fs.writeFileSync(toolsTemp, toolsJson);
            fs.writeFileSync(stateTemp, stateJson);
            JSON.parse(fs.readFileSync(toolsTemp, 'utf8'));
            JSON.parse(fs.readFileSync(stateTemp, 'utf8'));
            fs.renameSync(toolsTemp, toolsPath);
            fs.renameSync(stateTemp, statePath);

            core.info(`Health refresh complete: checked=${checked}, updated=${updated}, failed=${failed}`);

      - name: Commit refreshed project health
        run: |
          if git diff --quiet -- data/tools.json data/health-state.json; then
            echo "No health changes."
            exit 0
          fi

          git config user.name "openshelf-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/tools.json data/health-state.json
          git commit -m "chore: hourly project health refresh"

          # Discovery may have committed while this job was running.
          git pull --rebase origin main
          git push
