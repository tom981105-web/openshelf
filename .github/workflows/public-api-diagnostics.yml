name: Public API official source diagnostics
on:
  pull_request:
    paths:
      - 'scripts/diagnose-public-apis.mjs'
      - 'scripts/diagnose-public-apis.test.mjs'
      - 'scripts/discover-public-apis.mjs'
      - '.github/workflows/public-api-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit test diagnostic parser
        run: node scripts/diagnose-public-apis.test.mjs
      - name: Probe real official portal response
        run: node scripts/diagnose-public-apis.mjs
      - name: V10 live batch discovery
        run: |
          node --input-type=module -e "import {discover} from './scripts/discover-public-apis.mjs'; await discover({pages:20,maxDetails:200});"
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('data/public-api-candidates.json','utf8'));console.log('V10_CANDIDATES_JSON='+JSON.stringify(c.items));"

