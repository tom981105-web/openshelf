name: Public API official source diagnostics
on:
  pull_request:
    paths:
      - 'scripts/diagnose-public-apis.mjs'
      - 'scripts/diagnose-public-apis.test.mjs'
      - 'scripts/discover-public-apis.mjs'
      - 'scripts/build-public-api-list.mjs'
      - 'scripts/public-api-full-catalog.test.mjs'
      - 'scripts/public-api-csv-shards.test.mjs'
      - 'scripts/public-api-v17.test.mjs'
      - 'scripts/public-api-v18.test.mjs'
      - 'scripts/public-api-v19.test.mjs'
      - 'scripts/public-data-v21-v22.test.mjs'
      - 'public-data.js'
      - 'public-data.html'
      - 'public-data.css'
      - 'data/public-data-csv/**'
      - 'data/public-data-official-list.json'
      - 'scripts/public-api-v20.test.mjs'
      - 'scripts/validate-public-api-v20.mjs'
      - 'scripts/update-public-api-csv.mjs'
      - '.github/workflows/public-api-monthly-update.yml'
      - 'public-api.css'
      - 'public-api.js'
      - 'public-api.html'
      - 'data/public-api-official-list.json'
      - 'data/public-api-csv/**'
      - 'scripts/verify-public-api-csv.mjs'
      - 'scripts/import-public-api-csv.mjs'
      - 'scripts/import-public-api-csv.test.mjs'
      - '.github/workflows/public-api-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit test diagnostic parser
        run: node scripts/diagnose-public-apis.test.mjs
      - name: Official CSV candidate import tests
        run: node scripts/import-public-api-csv.test.mjs
      - name: Verify CSV staging script syntax
        run: node --check scripts/verify-public-api-csv.mjs
      - name: Full CSV catalog integration tests
        run: node scripts/public-api-full-catalog.test.mjs
      - name: Full CSV shard integrity tests
        run: node scripts/public-api-csv-shards.test.mjs
      - name: V17 search and loading regression tests
        run: node scripts/public-api-v17.test.mjs
      - name: V18 classification and filter tests
        run: node scripts/public-api-v18.test.mjs
      - name: V19 API detail panel regression tests
        run: node scripts/public-api-v19.test.mjs
      - name: V20 CSV update regression tests
        run: node scripts/public-api-v20.test.mjs
      - name: V20 dynamic catalog validation
        run: node scripts/validate-public-api-v20.mjs
      - name: Public Data V21/V22 full catalog validation
        run: node scripts/public-data-v21-v22.test.mjs
      - name: Probe real official portal response
        run: node scripts/diagnose-public-apis.mjs
      - name: Dry-run one official discovery page (do not commit)
        run: node --input-type=module -e "import {discover} from './scripts/discover-public-apis.mjs'; await discover({pages:1,maxDetails:12});"

