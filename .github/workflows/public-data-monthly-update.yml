name: Public Data official CSV update check
on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  official-files:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover current official CSV attachment and download
        run: node scripts/download-official-catalog-csv.mjs /tmp/official-public-data.csv
      - name: Verify latest file catalog changes
        run: |
          node scripts/update-public-data-csv.mjs /tmp/official-public-data.csv "$(date -u +%F)"
          node scripts/validate-public-data-v25.mjs
      - name: Create change-review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/public-data-official-csv
          delete-branch: true
          commit-message: 'data: update official file catalog metadata'
          title: 'data: review official file catalog changes'
          body: |
            Official public-file metadata update, not a verified file download.
            Review `data/public-data-update-report.json` before merging.
            Newly added, changed and removed file IDs are listed. Removals must be reviewed manually.
          add-paths: |
            data/public-data-official-list.json
            data/public-data-csv/*.json
            data/public-data-update-report.json
