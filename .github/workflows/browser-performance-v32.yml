name: V32 browser performance regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'unified-search.html'
      - 'unified-search.js'
      - 'ai-search-config.js'
      - 'worker/ai-smart-search.mjs'
      - 'scripts/ai-search-v39.test.mjs'
      - 'gemini-key-vault.js'
      - 'scripts/v44-unified-auto.test.mjs'
      - 'gemini-direct-client.js'
      - 'scripts/gemini-direct-v43.test.mjs'
      - 'scripts/audit-public-data-v46.mjs'
      - 'scripts/audit-public-data-v46.test.mjs'
      - 'scripts/probe-public-data-v47.mjs'
      - 'scripts/probe-public-data-v47.test.mjs'
      - 'scripts/diagnose-public-data-v48.mjs'
      - 'scripts/diagnose-public-data-v48.test.mjs'
      - '.github/workflows/public-data-v48-diagnostics.yml'
      - '.github/workflows/public-data-v47-probe.yml'
      - '.github/workflows/public-data-v46-audit.yml'
      - 'scripts/gemini-key-v40.test.mjs'
      - 'scripts/gemini-key-v42.test.mjs'
      - 'scripts/gemini-save-ui-v41.test.mjs'
      - 'unified-search-core.mjs'
      - 'unified-search.css'
      - 'catalog-ui-v33.css'
      - 'public-api.html'
      - 'public-data.html'
      - 'scripts/catalog-ui-v33.test.mjs'
      - 'scripts/search-cards-v34.test.mjs'
      - 'scripts/browser-performance-v32.mjs'
      - 'scripts/search-card-overflow.test.mjs'
      - '.github/workflows/browser-performance-v32.yml'
      - 'data/public-api-csv/**'
      - 'data/public-data-csv/**'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium testing tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/openshelf-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/unified-search.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Validate V33 catalogue markup and styles
        run: node scripts/catalog-ui-v33.test.mjs
      - name: Validate V34 card and detail markup
        run: node scripts/search-cards-v34.test.mjs
      - name: Validate V39 AI boundary and fallback
        run: node scripts/ai-search-v39.test.mjs
      - name: Verify overflow regression
        run: node scripts/search-card-overflow.test.mjs
      - name: Verify personal Gemini key vault and no shared key
        run: |
          node scripts/gemini-key-v40.test.mjs
          node scripts/gemini-key-v42.test.mjs
      - name: Verify nav and Gemini save behaviour
        run: node scripts/gemini-save-ui-v41.test.mjs
      - name: Validate direct Gemini integration
        run: node scripts/gemini-direct-v43.test.mjs
      - name: Verify V44 auto key and unified defaults
        run: node scripts/v44-unified-auto.test.mjs
      - name: Validate V46 file-data audit sampling and classification
        run: node scripts/audit-public-data-v46.test.mjs
      - name: Validate V47 bounded file download probes
        run: node scripts/probe-public-data-v47.test.mjs
      - name: Validate V48 download mechanism diagnostics
        run: node scripts/diagnose-public-data-v48.test.mjs
      - name: Measure real Chromium search flows
        run: node scripts/browser-performance-v32.mjs
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-report
          path: browser-performance-report.json
          if-no-files-found: warn
