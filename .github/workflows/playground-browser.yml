name: Playground real browser smoke
on:
  pull_request:
    paths:
      - 'playground-**'
      - 'browser-tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/playground-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve checked-out site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/openshelf-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/playground-python.html > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test actual browser interactions
        run: npx playwright test -c playwright.config.mjs
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser-failures
          path: test-results/
          if-no-files-found: ignore
