name: Category chips overflow regression
on:
  pull_request:
    paths:
      - 'styles.css'
      - 'scripts/category-chips-overflow.test.mjs'
      - '.github/workflows/category-chips-overflow.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/category-chips-overflow.test.mjs
