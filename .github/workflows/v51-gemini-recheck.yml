name: V51 Gemini recheck tests
on:
  pull_request:
    paths:
      - 'scripts/gemini-recheck-v51.mjs'
      - 'scripts/gemini-recheck-v51.test.mjs'
      - '.github/workflows/v51-gemini-recheck.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/gemini-recheck-v51.test.mjs
