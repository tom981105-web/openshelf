<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3efe7">
  <title>404 — OpenShelf</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#f3efe7;--paper:#fffdf8;--ink:#141414;--muted:#746f66;--line:#d5cec3;--accent:#ff5f39}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;display:grid;place-items:center;padding:28px}
    .wrap{width:min(920px,100%);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:60px 0}
    .brand{font:700 22px/1 Georgia,serif}.code{font:700 clamp(110px,23vw,250px)/.75 Georgia,serif;color:var(--accent);letter-spacing:-.08em;margin:70px 0 30px}
    h1{font:700 clamp(36px,6vw,64px)/1 Georgia,serif;margin:0 0 18px}p{max-width:620px;color:var(--muted);line-height:1.7}
    a{display:inline-block;margin-top:25px;background:var(--ink);color:white;padding:12px 16px;text-decoration:none;font-weight:800;font-size:13px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">OpenShelf</div>
    <div class="code">404</div>
    <h1>이 선반에는 아무것도 없어요.</h1>
    <p>주소가 바뀌었거나 존재하지 않는 페이지예요. OpenShelf 홈으로 돌아가 필요한 도구를 다시 찾아보세요.</p>
    <a href="/openshelf/">OpenShelf로 돌아가기 →</a>
  </main>
</body>
</html>
