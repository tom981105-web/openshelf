<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체 도구 체험 — OpenShelf</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="playground.css"><link rel="stylesheet" href="playground-hub.css"></head><body><main class="playground-shell"><a class="playground-back" href="playground-hub.html">← Playground Hub</a><div class="playground-eyebrow">OPENSHELF / ALL TOOLS</div><h1>Try the tools<span>.</span></h1><p class="playground-intro">전체 등록 도구의 공식 실행 경로와 사용 절차를 모았습니다. <strong>브라우저 체험이 확인된 도구</strong>와 <strong>설치·CLI 실행 안내</strong>를 구분합니다. 링크만 있다고 실제 온라인 실행이 가능하다고 표시하지 않습니다.</p><div class="hub-filters"><label class="alltools-search-label">도구 검색 <input id="trialSearch" type="search" placeholder="도구 이름·설명·태그 검색"></label><label class="alltools-search-label">보기 <select id="trialFilter"><option value="all">전체</option><option value="verified">확인된 체험 연결</option><option value="website">외부 웹사이트</option><option value="guide">설치·사용 가이드</option></select></label></div><p id="trialCount" role="status" class="playground-footnote">도구 목록을 불러오는 중…</p><div id="trialList" class="hub-grid"></div><button type="button" id="trialMore" class="playground-primary" hidden>더 보기</button><section id="trialPanel" class="playground-panel alltools-panel" hidden aria-live="polite"><button type="button" id="trialClose">× 닫기</button><h2 id="trialTitle"></h2><p id="trialNotice"></p><div id="trialSteps"></div><div id="trialActions" class="playground-actions"></div></section><p class="playground-footnote">설치형 프로그램은 OpenShelf 서버에서 대신 실행하지 않습니다. 실습 안내는 등록된 메타데이터를 기반으로 하며 외부 사이트의 보안·호환성·서비스 상태를 보증하지 않습니다.</p></main><script src="playground-catalog.js"></script><script src="playground-all.js" defer></script></body></html>
